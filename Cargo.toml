[package]
name = "sjmb_slack"
version = "1.7.0"
edition = "2024"
resolver = "2"
authors = ["Sami J. Mäkinen <sjm@iki.fi>"]
description = "My Slack bot"
repository = "https://github.com/sjm42/sjmb-slack"
readme = "README.md"
keywords = ["slack", "bot"]
license = "MIT OR Apache-2.0"

[features]
default = ["socket-mode"]
socket-mode = ["slack-morphism/axum"]
user-session = ["dep:tokio-tungstenite", "dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:http-body-util", "dep:bytes"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
http = "1.5"
regex = "1.13"
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = { version = "3.1", features = ["full"] }
slack-morphism = { version = "2.31", features = ["hyper"] }
sqlx = { version = "0.9", features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
tokio = { version = "1.53", features = ["full"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"
url = "2.5"
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["connect", "rustls-tls-native-roots"] }
hyper = { version = "1", optional = true, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", optional = true, features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["http1", "http2", "native-tokio", "ring"] }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }


[build-dependencies]
anyhow = "1.0"
build-data = "0.3"

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring"] }


[profile.release]
lto = "fat"
opt-level = 3

